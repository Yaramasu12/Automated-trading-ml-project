# docker-compose.yml — REDESIGN_PROMPT.md §7, §11
# All services run locally (Apple Silicon or otherwise). Zero cloud dependencies.
#
# Core app (trading-api, scheduler, frontend, timescaledb) has no profile —
# `docker compose up` starts it exactly as before. The newer infra
# (redis, qdrant, mlflow, prometheus, grafana, loki) is opt-in via
# `--profile research|paper|live` since nothing in the app wires to it yet
# (no Redis Streams tick bus, no Qdrant-backed RAG, no MLflow-backed
# registry are on the live code path — see docs/PHASE1_IMPLEMENTATION_SUMMARY.md's
# actual wiring status before enabling any of these in anger).
#
# NOTE: an earlier version of this file split the app into 7 "microservices"
# (market-data, strategy-engine, risk-service, execution-service,
# intelligence, research, fastapi-app) whose commands pointed at
# `trading_platform.services.*` and `trading_platform.api.main:app` — neither
# `trading_platform/services/` nor `api/main.py` exist. The app is still one
# FastAPI monolith (`trading_platform.api.app:app`, per the Dockerfile CMD);
# splitting it into real services is unstarted Phase-3 work, not a config change.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

x-logging-large: &large-logging
  driver: json-file
  options:
    max-size: "500m"
    max-file: "5"

services:
  # ── PostgreSQL 16 + TimescaleDB + pgvector ───────────────────────────────
  # timescale/timescaledb-ha ships TimescaleDB and pgvector in one image.
  # Data lives in a named volume so it survives container restarts.
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: trading-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-trading}
      POSTGRES_USER:     ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_secret}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
      # REDESIGN §7 core OLTP tables + hypertables — additive, idempotent (IF NOT EXISTS)
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deploy/db/init-timescale.sql:/docker-entrypoint-initdb.d/02-init-timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *large-logging

  # ── FastAPI trading backend (the one real app process) ───────────────────
  trading-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:8100:8000"
    volumes:
      - ./data:/app/data
      - ./backtest_results:/app/backtest_results
      - ./models:/app/models
    # Secrets are injected from the host environment, not from a mounted .env file.
    # Export variables in your shell (or CI/CD secrets store) before running
    # docker compose up. See .env.example for the full list of required variables.
    environment:
      - PYTHONUNBUFFERED=1
      # Peak-memory controls (see agent scan loop). Concurrency 2 keeps the
      # orchestrated scan within ~2 GB; raise on larger hosts for faster sweeps.
      - AGENT_SCAN_CONCURRENCY=${AGENT_SCAN_CONCURRENCY:-2}
      # Narrow the scan universe (comma list). Empty = full default universe.
      - AGENT_SCAN_UNDERLYINGS=${AGENT_SCAN_UNDERLYINGS:-}
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
      # Trade-gate tuning (lower = trades weaker signals, higher = more selective).
      - CREW_HOLD_BAND=${CREW_HOLD_BAND:-0.05}
      - PROFIT_GUARD_SHARPE_MIN=${PROFIT_GUARD_SHARPE_MIN:-0.04}
      - NEURAL_UNCERTAINTY_VETO=${NEURAL_UNCERTAINTY_VETO:-0.82}
      - FUSION_PROCEED_THRESHOLD=${FUSION_PROCEED_THRESHOLD:-0.42}
      - CREW_ADVISORY=${CREW_ADVISORY:-true}
      - PROFIT_GUARD_EV_MIN=${PROFIT_GUARD_EV_MIN:-0.0003}
      - PROFIT_GUARD_KELLY_MIN=${PROFIT_GUARD_KELLY_MIN:-0.005}
      - SHORTVOL_AUTO_ENABLED=${SHORTVOL_AUTO_ENABLED:-false}
      - SHORTVOL_AUTO_UNDERLYINGS=${SHORTVOL_AUTO_UNDERLYINGS:-NIFTY}
      - SHORTVOL_ENTRY_WEEKDAY=${SHORTVOL_ENTRY_WEEKDAY:-0}
      - SHORTVOL_ENTRY_HOUR=${SHORTVOL_ENTRY_HOUR:-10}
      # GARCH vol forecast for VRP (validated: beats naive on all indices).
      - SHORTVOL_USE_VOL_FORECAST=${SHORTVOL_USE_VOL_FORECAST:-false}
      # Fractional-Kelly sizing (0 = risk-budget only) + multi-expiry (1 = nearest).
      - SHORTVOL_KELLY_FRACTION=${SHORTVOL_KELLY_FRACTION:-0.30}
      - SHORTVOL_MAX_EXPIRIES=${SHORTVOL_MAX_EXPIRIES:-1}
      # Structures: condor, put_spread, call_spread. Continuous = enter whenever
      # VRP rich (not just Mondays); MIN_DTE skips near-expiry (quality filter).
      - SHORTVOL_STRUCTURES=${SHORTVOL_STRUCTURES:-condor}
      - SHORTVOL_CONTINUOUS=${SHORTVOL_CONTINUOUS:-false}
      - SHORTVOL_MIN_DTE=${SHORTVOL_MIN_DTE:-1}
      # Structure-level active exit: close early at 50% of credit captured, or
      # stop out at a 1.5x-credit loss (well inside the wing-capped max loss).
      # Expiry (in the per-leg ExitPlan) is the backstop if neither fires.
      - SHORTVOL_PROFIT_TARGET_PCT=${SHORTVOL_PROFIT_TARGET_PCT:-0.50}
      - SHORTVOL_STOP_LOSS_MULTIPLE=${SHORTVOL_STOP_LOSS_MULTIPLE:-1.5}
      - EXIT_TARGET_PCT=${EXIT_TARGET_PCT:-0.008}
      - EXIT_STOP_PCT=${EXIT_STOP_PCT:-0.005}
      - EXIT_TRAIL_PCT=${EXIT_TRAIL_PCT:-0.004}
      - EXECUTION_MODE=${EXECUTION_MODE:-BACKTEST}
      - BROKER=${BROKER:-ANGEL_ONE}
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-false}
      - INITIAL_CAPITAL=${INITIAL_CAPITAL:-1000000}
      - MAX_DRAWDOWN=${MAX_DRAWDOWN:-0.10}
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-0.02}
      - MAX_POSITION_PCT=${MAX_POSITION_PCT:-0.05}
      - MAX_MARGIN_UTILIZATION=${MAX_MARGIN_UTILIZATION:-0.60}
      - LIVE_ORDER_CONFIRMATION=${LIVE_ORDER_CONFIRMATION:-}
      - ANGEL_ONE_API_KEY=${ANGEL_ONE_API_KEY:-}
      - ANGEL_ONE_API_SECRET=${ANGEL_ONE_API_SECRET:-}
      - ANGEL_ONE_CLIENT_CODE=${ANGEL_ONE_CLIENT_CODE:-}
      - ANGEL_ONE_PIN=${ANGEL_ONE_PIN:-}
      - ANGEL_ONE_TOTP_SECRET=${ANGEL_ONE_TOTP_SECRET:-}
      - ANGEL_ONE_INSTRUMENT_MASTER_URL=${ANGEL_ONE_INSTRUMENT_MASTER_URL:-https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json}
      - ANGEL_ONE_INSTRUMENT_CACHE_PATH=${ANGEL_ONE_INSTRUMENT_CACHE_PATH:-data/processed/angel_one_instruments.json}
      # SEBI retail-algo Algo-ID (see config.py's angel_one_algo_id docstring)
      # — empty until you've actually registered with Angel One's
      # registered-algo program; every order stays untagged until then.
      - ANGEL_ONE_ALGO_ID=${ANGEL_ONE_ALGO_ID:-}
      # Angel One's published getCandleData limit is ~180/min (3 req/s); real-world
      # forum reports show stricter-than-published enforcement in practice, so
      # 0.35s (~2.9 req/s) keeps meaningful margin rather than pushing to the
      # documented edge. This was previously unset anywhere (silently using the
      # code's 0.4s default) — read via os.getenv directly, not Settings, so it
      # must be listed here explicitly or .env alone does nothing (same class of
      # gap as the LOCAL_LLM_* vars earlier).
      - ANGEL_ONE_CANDLE_MIN_INTERVAL=${ANGEL_ONE_CANDLE_MIN_INTERVAL:-0.35}
      - ANGEL_ONE_CANDLE_RETRIES=${ANGEL_ONE_CANDLE_RETRIES:-3}
      # Set API_AUTH_TOKEN in your shell/CI secrets before running in production.
      # Local dev: auth is disabled by default so the container starts without a token.
      # Production: export API_AUTH_REQUIRED=true API_AUTH_TOKEN=<your-secret> before compose up.
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
      - API_AUTH_REQUIRED=${API_AUTH_REQUIRED:-false}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - AUTO_START_AGENT=${AUTO_START_AGENT:-false}
      - AUTO_START_LIVE_FEED=${AUTO_START_LIVE_FEED:-false}
      - AUTO_LOAD_INSTRUMENT_CACHE=${AUTO_LOAD_INSTRUMENT_CACHE:-true}
      - AUTO_LOAD_MODELS=${AUTO_LOAD_MODELS:-false}
      - PREMARKET_REFRESH_INSTRUMENTS=${PREMARKET_REFRESH_INSTRUMENTS:-false}
      - LIVE_FEED_DEFAULT_SYMBOLS=${LIVE_FEED_DEFAULT_SYMBOLS:-NIFTY,BANKNIFTY,FINNIFTY,SENSEX,RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK,SBIN}
      - LIVE_FEED_MAX_SYMBOLS=${LIVE_FEED_MAX_SYMBOLS:-80}
      - ENABLE_AI_COUNCIL=${ENABLE_AI_COUNCIL:-true}
      - ENABLE_NEURAL_LAB=${ENABLE_NEURAL_LAB:-true}
      - ENABLE_MARL_LAB=${ENABLE_MARL_LAB:-true}
      - ENABLE_GOAL_GOVERNOR=${ENABLE_GOAL_GOVERNOR:-true}
      # PostgreSQL connection — auto-activates the PostgreSQL backend in TradingDatabase
      - DATABASE_URL=${DATABASE_URL:-postgresql://trading:trading_secret@timescaledb:5432/trading}
      - LOCAL_LLM_GATEWAY=${LOCAL_LLM_GATEWAY:-disabled}
      - LOCAL_LLM_RUNTIME=${LOCAL_LLM_RUNTIME:-stub}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://localhost:11434}
      - LOCAL_LLM_PRIMARY_MODEL=${LOCAL_LLM_PRIMARY_MODEL:-gemma4-31b}
      - LOCAL_LLM_FAST_MODEL=${LOCAL_LLM_FAST_MODEL:-gemma4-e4b}
      # 4th model-pool slot (see config.py's local_llm_secondary_model /
      # specialists.py's BATCHABLE_AGENT_CLASSES) -- this line was missing
      # entirely when the setting was first added, so .env's value never
      # reached the container; Settings' own default-to-fast_model fallback
      # silently masked the gap (confirmed live 2026-09-01: /ai-council/status
      # reported secondary == fast instead of the distinct 4th model).
      - LOCAL_LLM_SECONDARY_MODEL=${LOCAL_LLM_SECONDARY_MODEL:-}
      - LOCAL_LLM_COORDINATOR_MODEL=${LOCAL_LLM_COORDINATOR_MODEL:-gemma4-26b-moe}
      - LOCAL_LLM_EMBEDDING_MODEL=${LOCAL_LLM_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      - LOCAL_LLM_SENTIMENT_MODEL=${LOCAL_LLM_SENTIMENT_MODEL:-llama-3-8b-instruct-finance-rag}
      - LOCAL_LLM_TIMEOUT_SECONDS=${LOCAL_LLM_TIMEOUT_SECONDS:-15}
      - LOCAL_LLM_MAX_OUTPUT_TOKENS=${LOCAL_LLM_MAX_OUTPUT_TOKENS:-2048}
      - LOCAL_LLM_MAX_CONCURRENT_CALLS=${LOCAL_LLM_MAX_CONCURRENT_CALLS:-2}
      # Qdrant backs VectorMemoryStore's persistence (agents/vector_memory.py) —
      # best-effort only, never blocks startup: qdrant is opt-in infra (the
      # `qdrant` service below only starts under --profile research|paper|live),
      # so QDRANT_ENABLED defaulting true costs nothing when it isn't running.
      # Host is the compose service name, not localhost/127.0.0.1 — container-
      # to-container DNS, unrelated to the Windows host resolver delay noted
      # in config.py's QDRANT_HOST default.
      - QDRANT_ENABLED=${QDRANT_ENABLED:-true}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - YEARLY_PROFIT_TARGET=${YEARLY_PROFIT_TARGET:-50000000}
      - TRADING_API_BASE_URL=${TRADING_API_BASE_URL:-http://trading-api:8000}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *large-logging

  # ── Daily scheduler (EOD square-off, instrument refresh, reports) ────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-scheduler
    restart: unless-stopped
    command: ["python", "scripts/daily_scheduler.py"]
    volumes:
      - ./data:/app/data
    # Inherit the same environment variables from host; no .env file mount.
    environment:
      - PYTHONUNBUFFERED=1
      - EXECUTION_MODE=${EXECUTION_MODE:-BACKTEST}
      - BROKER=${BROKER:-ANGEL_ONE}
      - ANGEL_ONE_API_KEY=${ANGEL_ONE_API_KEY:-}
      - ANGEL_ONE_API_SECRET=${ANGEL_ONE_API_SECRET:-}
      - ANGEL_ONE_CLIENT_CODE=${ANGEL_ONE_CLIENT_CODE:-}
      - ANGEL_ONE_PIN=${ANGEL_ONE_PIN:-}
      - ANGEL_ONE_TOTP_SECRET=${ANGEL_ONE_TOTP_SECRET:-}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
      - TRADING_API_BASE_URL=${TRADING_API_BASE_URL:-http://trading-api:8000}
      - INITIAL_CAPITAL=${INITIAL_CAPITAL:-1000000}
      - MAX_DRAWDOWN=${MAX_DRAWDOWN:-0.10}
      - MAX_DAILY_LOSS=${MAX_DAILY_LOSS:-0.02}
    depends_on:
      trading-api:
        condition: service_healthy
    healthcheck:
      # Write a heartbeat file every job cycle; check that it was touched recently.
      # The scheduler writes this file in _checkpoint_sqlite_wal() via a side effect.
      # As a lightweight alternative, verify the trading-api is still reachable.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://trading-api:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ── React frontend (built → Nginx, proxies /api and /ws to backend) ──────
  frontend:
    build:
      context: ./hft_frontend
      dockerfile: Dockerfile
    container_name: trading-frontend
    restart: unless-stopped
    ports:
      # Bind to localhost only — the dashboard is not intended to be publicly reachable.
      # Change to 0.0.0.0:3100:3000 only if you need external access and have added auth.
      - "0.0.0.0:3100:3000"
    depends_on:
      trading-api:
        condition: service_healthy
    logging: *default-logging

  # ──────────────────────────────────────────────────────────────────────────
  # Newer infra (REDESIGN §2/§7/§8/§11) — opt-in, `--profile research|paper|live`.
  # Stock images only, no custom config mounts, so they start clean with
  # sane defaults. Nothing in trading_platform/ talks to these yet (no Redis
  # Streams tick bus, no Qdrant-backed RAG, no MLflow registry on the live
  # code path) — bring them up when you're ready to wire something to them,
  # not as decoration.
  # ──────────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7.4-alpine
    profiles: ["research", "paper", "live"]
    restart: unless-stopped
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redis_data:/data
    logging: *default-logging

  # Web UI for `redis` above — browse keys, run commands, no CLI needed.
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["research", "paper", "live"]
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: saikumarynwm@gmail.com
      HTTP_PASSWORD: admin
    ports:
      - "0.0.0.0:8081:8081"
    depends_on:
      - redis
    logging: *default-logging

  # Web UI for `timescaledb` above — browse tables, run SQL, no CLI needed.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["research", "paper", "live"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: saikumarynwm@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Local-only dev tool (bound to localhost, no real auth boundary to
      # protect) -- the master-password prompt on top of the login above
      # is pure friction here, not a meaningful second factor.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "0.0.0.0:8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - timescaledb
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.11.0
    profiles: ["research", "paper", "live"]
    restart: unless-stopped
    ports:
      - "0.0.0.0:6333:6333"
      - "0.0.0.0:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    profiles: ["research", "paper", "live"]
    restart: unless-stopped
    ports:
      - "0.0.0.0:5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////opt/mlflow/mlflow.db
      --default-artifact-root /opt/mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/opt/mlflow
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["research", "paper", "live"]
    restart: unless-stopped
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - prometheus_data:/prometheus
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["research", "paper", "live"]
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: saikumarynwm@gmail.com
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    logging: *default-logging

  loki:
    image: grafana/loki:3.4.0
    profiles: ["research", "paper", "live"]
    restart: unless-stopped
    ports:
      # Host 3100 is already claimed by the frontend service above
      # (127.0.0.1:3100:3000) — Loki's own default port (3100) moves to
      # 3101 on the host side only; the container still listens on 3100.
      - "0.0.0.0:3101:3100"
    volumes:
      - loki_data:/loki
    logging: *default-logging

volumes:
  timescaledb_data:
    name: trading-timescaledb-data
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  mlflow_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: trading-network
