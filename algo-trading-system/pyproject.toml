[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading-system"
version = "1.0.0"
description = "Production-grade automated trading system with paper-trading-first design"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Algo Trading Team"}
]
dependencies = [
    # Core trading engine
    "nautilusTrader>=1.200.0",
    
    # Data & storage
    "clickhouse-connect>=0.7.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "qdrant-client>=1.7.0",
    
    # Event bus
    "confluent-kafka>=2.3.0",
    
    # Data processing
    "polars>=0.20.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    
    # ML/DL
    "lightgbm>=4.3.0",
    "torch>=2.2.0",
    "pytorch-forecasting>=1.2.0",
    "scikit-learn>=1.4.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    
    # Portfolio optimization
    "scikit-portfolio>=0.3.0",
    "PyPortfolioOpt>=3.3.0",
    
    # Reinforcement learning
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.3.0",
    
    # Experiment tracking
    "mlflow>=2.14.0",
    "evidently>=0.4.0",
    
    # Orchestration
    "prefect>=2.18.0",
    
    # LangGraph/CrewAI for agentic research
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "crewai>=0.30.0",
    
    # API & config
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    
    # Logging & monitoring
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    
    # Testing
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    
    # Type checking
    "mypy>=1.10.0",
    
    # Linting/formatting
    "ruff>=0.4.0",
    "black>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ipython>=8.24.0",
]
gpu = [
    "torch>=2.2.0",
    "pytorch-forecasting>=1.2.0",
    "cuda-python>=12.6.0",
]

[tool.setuptools.packages.find]
include = ["trading_platform*", "common*", "ingestion*", "research*", "strategies*", "execution*", "risk*", "ops*"]
exclude = ["tests*", "docs*", "docker*", "deploy*"]

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM", "RUF"]
lint.ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["nautilus_trader.*", "polars", "confluent_kafka", "qdrant_client"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: marks tests that require live services",
    "integration: marks tests as integration tests",
    "backtest: marks tests as backtest regression tests",
]

[tool.uv]
index-url = "https://pypi.org/simple"