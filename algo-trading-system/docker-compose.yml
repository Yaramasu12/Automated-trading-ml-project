# Algo-Trading-System Docker Compose
# Full stack: ingestion, storage, research, strategy, risk, execution, ops
version: "3.9"

x-common-env: &common-env
  TZ: "${TZ:-UTC}"
  PYTHONUNBUFFERED: "1"

services:
  # ============================================================
  # Redpanda — Kafka-compatible event bus (L1 ingestion backbone)
  # ============================================================
  redpanda-0:
    image: docker.redpanda.com/vectorized/redpanda:v23.2.22
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --pandaproxy-addr internal://0.0.0.0:8082,external://localhost:18082
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --smp 1
      - --memory 1G
      - --seed-server-members "redpanda-0:33145"
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18082:18082"
      - "8081:8081"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "ingestion", "storage"]

  # ============================================================
  # ClickHouse — tick / L2 analytical store (L2)
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ats_ticks}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ats_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ats_pass}
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "storage"]

  # ============================================================
  # TimescaleDB / PostgreSQL — time-series + metadata (L2)
  # ============================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-ats_timescale}
      POSTGRES_USER: ${TIMESCALE_USER:-ats_ts_user}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-ats_ts_pass}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./deploy/db/init-timescale.sql:/docker-entrypoint-initdb.d/001-timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-ats_ts_user} -d ${TIMESCALE_DB:-ats_timescale}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "storage"]

  # ============================================================
  # PostgreSQL — accounts, config, audit (L2)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats_main}
      POSTGRES_USER: ${POSTGRES_USER:-ats_main_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ats_main_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/000-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ats_main_user} -d ${POSTGRES_DB:-ats_main}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "storage"]

  # ============================================================
  # MinIO — Parquet data lake (S3-compatible) (L2)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-ats_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-ats_minio_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "storage"]

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD;
      mc mb --ignore-existing local/ats-ticks;
      mc mb --ignore-existing local/ats-bars;
      mc mb --ignore-existing local/ats-lake;
      mc mb --ignore-existing local/ats-features;
      exit 0;
      "
    environment:
      MINIO_USER: ${MINIO_USER:-ats_minio_user}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-ats_minio_pass}
    networks:
      - ats-net
    profiles: ["all", "storage"]

  # ============================================================
  # Redis — hot state / cache (L2)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "storage", "strategy"]

  # ============================================================
  # Qdrant — vector DB for RAG (L2)
  # ============================================================
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant
    environment:
      QDRANT_SERVICE_URL: "http://qdrant:6333"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "research"]

  # ============================================================
  # MLflow — experiment tracking & model registry (L3)
  # ============================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-ats_minio_user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-ats_minio_pass}
    command: mlflow server --default-store sqlite:////opt/mlflow/mlflow.db --backend-store-uri sqlite:////opt/mlflow/mlflow.db --artifacts-location s3://ats-lake/mlflow --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/opt/mlflow
    depends_on:
      - minio
    networks:
      - ats-net
    profiles: ["all", "research"]

  # ============================================================
  # Prometheus — metrics (L7)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "ops"]

  # ============================================================
  # Grafana — dashboards (L7)
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ats-net
    profiles: ["all", "ops"]

  # ============================================================
  # Loki — structured logs (L7)
  # ============================================================
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./ops/loki:/etc/loki:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - ats-net
    profiles: ["all", "ops"]

  # ============================================================
  # Alertmanager — alerting (L7)
  # ============================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./ops/alertmanager:/etc/alertmanager:ro
    command: >
      --config.file=/etc/alertmanager/alertmanager.yml
      --storage.path=/alertmanager
    networks:
      - ats-net
    profiles: ["all", "ops"]

  # ============================================================
  # Prefect — orchestration (L7)
  # ============================================================
  prefect:
    image: prefecthq/prefect:2.14.4-python3.11
    container_name: prefect
    environment:
      PREFECT_API_URL: "http://prefect-server:4200/api"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${PREFECT_DB:-ats_prefect}
      POSTGRES_USER: ${PREFECT_USER:-ats_prefect_user}
      POSTGRES_PASSWORD: ${PREFECT_PASSWORD:-ats_prefect_pass}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-net
    profiles: ["all", "ops"]

  prefect-server:
    image: prefecthq/prefect:2.14.4-python3.11
    container_name: prefect-server
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION: "postgresql+asyncpg://${PREFECT_USER:-ats_prefect_user}:${PREFECT_PASSWORD:-ats_prefect_pass}@postgres:5432/${PREFECT_DB:-ats_prefect}"
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_SERVER_API_PORT: 4200
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ats-net
    profiles: ["all", "ops"]

  # ============================================================
  # Ingestion Service (L1)
  # ============================================================
  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    container_name: ingestion
    environment:
      <<: *common-env
      MODE: "${MODE:-paper}"
      REDPANDA_BROKERS: "redpanda-0:9092"
      CLICKHOUSE_URL: "clickhouse://ats_user:ats_pass@clickhouse:9000/ats_ticks"
      TIMESCALE_URL: "postgresql+asyncpg://ats_ts_user:ats_ts_pass@timescaledb:5432/ats_timescale"
      POSTGRES_URL: "postgresql+asyncpg://ats_main_user:ats_main_pass@postgres:5432/ats_main"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_USER: "${MINIO_USER:-ats_minio_user}"
      MINIO_PASSWORD: "${MINIO_PASSWORD:-ats_minio_pass}"
      REDIS_URL: "redis://redis:6379/0"
      DATA_SOURCE: "${DATA_SOURCE:-mock}"
    depends_on:
      redpanda-0:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - ats-net
    profiles: ["all", "ingestion"]

  # ============================================================
  # Research / ML Training Service (L3)
  # ============================================================
  research:
    build:
      context: .
      dockerfile: docker/Dockerfile.research
    container_name: research
    environment:
      <<: *common-env
      MODE: "${MODE:-paper}"
      CLICKHOUSE_URL: "clickhouse://ats_user:ats_pass@clickhouse:9000/ats_ticks"
      TIMESCALE_URL: "postgresql+asyncpg://ats_ts_user:ats_ts_pass@timescaledb:5432/ats_timescale"
      POSTGRES_URL: "postgresql+asyncpg://ats_main_user:ats_main_pass@postgres:5432/ats_main"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_USER: "${MINIO_USER:-ats_minio_user}"
      MINIO_PASSWORD: "${MINIO_PASSWORD:-ats_minio_pass}"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    depends_on:
      clickhouse:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./research:/app/research
      - ./models:/app/models
    networks:
      - ats-net
    profiles: ["all", "research"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  # ============================================================
  # Strategy Engine (L4 + L6) — NautilusTrader
  # ============================================================
  strategy-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.strategy
    container_name: strategy-engine
    environment:
      <<: *common-env
      MODE: "${MODE:-paper}"
      CONFIRM_LIVE: "${CONFIRM_LIVE:-}"
      REDPANDA_BROKERS: "redpanda-0:9092"
      CLICKHOUSE_URL: "clickhouse://ats_user:ats_pass@clickhouse:9000/ats_ticks"
      TIMESCALE_URL: "postgresql+asyncpg://ats_ts_user:ats_ts_pass@timescaledb:5432/ats_timescale"
      POSTGRES_URL: "postgresql+asyncpg://ats_main_user:ats_main_pass@postgres:5432/ats_main"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_USER: "${MINIO_USER:-ats_minio_user}"
      MINIO_PASSWORD: "${MINIO_PASSWORD:-ats_minio_pass}"
      REDIS_URL: "redis://redis:6379/0"
      IBKR_GATEWAY_HOST: "ib-gateway"
      IBKR_GATEWAY_PORT: "${IBKR_GATEWAY_PORT:-4002}"
      RISK_KILL_SWITCH: "true"
      STRATEGY_NAME: "${STRATEGY_NAME:-ma_crossover}"
    depends_on:
      redpanda-0:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./strategies:/app/strategies
      - ./risk:/app/risk
      - ./execution:/app/execution
    networks:
      - ats-net
    profiles: ["all", "strategy"]

  # ============================================================
  # Risk Service (L5)
  # ============================================================
  risk:
    build:
      context: .
      dockerfile: docker/Dockerfile.risk
    container_name: risk
    environment:
      <<: *common-env
      MODE: "${MODE:-paper}"
      POSTGRES_URL: "postgresql+asyncpg://ats_main_user:ats_main_pass@postgres:5432/ats_main"
      REDIS_URL: "redis://redis:6379/0"
      KILL_SWITCH_ENABLED: "${RISK_KILL_SWITCH:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./risk:/app/risk
    networks:
      - ats-net
    profiles: ["all", "risk"]

  # ============================================================
  # IB Gateway (Broker) — paper trading by default
  # ============================================================
  ib-gateway:
    image: interactivebrokers/gateway:latest
    container_name: ib-gateway
    environment:
      IB_GATEWAY_MODE: "paper"
      IB_GATEWAY_PORT: "4002"
      IB_GATEWAY_TRADING_MODE: "paper"
      IB_LOGON: "${IBKR_LOGIN:-}"
      IB_LOGON_PASSWORD: "${IBKR_PASSWORD:-}"
      IB_APPLICATION_ID: "${IBKR_APP_ID:-ATS}"
      IB_APPLICATION_VERSION: "3"
      IB_RWHost: "${IBKR_RW_HOST:-}"
      IB_RWPort: "${IBKR_RW_PORT:-}"
    ports:
      - "4002:4002"
      - "4003:4003"
      - "4004:4004"
    volumes:
      - ibkr_config:/root/.ibgateway
    networks:
      - ats-net
    profiles: ["all", "execution"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4002 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ============================================================
  # Crypto Mock Adapter (for testing without real keys)
  # ============================================================
  crypto-mock:
    build:
      context: .
      dockerfile: docker/Dockerfile.crypto_mock
    container_name: crypto-mock
    environment:
      <<: *common-env
      REDPANDA_BROKERS: "redpanda-0:9092"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      redpanda-0:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ats-net
    profiles: ["all", "execution"]

  # ============================================================
  # Monitoring Agent (Sentry / error capture)
  # ============================================================
  sentry:
    image: sentry:latest
    container_name: sentry
    environment:
      SENTRY_SECRET_KEY: "${SENTRY_SECRET_KEY:-ats-sentry-key-32chars-min}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sentry
      POSTGRES_USER: "${POSTGRES_USER:-ats_main_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ats_main_pass}"
      REDIS_URL: "redis://redis:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9095:9000"
    volumes:
      - sentry_data:/var/lib/sentry
    networks:
      - ats-net
    profiles: ["all", "ops"]

# ============================================================
# Volumes
# ============================================================
volumes:
  redpanda:
    driver: local
  clickhouse_data:
    driver: local
  timescale_data:
    driver: local
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  mlflow_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  ibkr_config:
    driver: local
  sentry_data:
    driver: local

# ============================================================
# Network
# ============================================================
networks:
  ats-net:
    driver: bridge