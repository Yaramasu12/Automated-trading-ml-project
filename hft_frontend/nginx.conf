server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. A literal hostname in proxy_pass is resolved once
    # at worker startup and cached forever — recreating trading-api (rebuild,
    # redeploy) gives it a new container IP that nginx never learns about,
    # producing "connection refused" until the frontend is restarted. Routing
    # proxy_pass through a variable forces per-request resolution against this
    # resolver instead, so backend recreates no longer require a frontend
    # restart. (Confirmed this exact failure mode 2026-07-28: trading-api was
    # rebuilt several times in one session; nginx kept trying its first IP.)
    resolver 127.0.0.11 valid=10s;

    # Proxy /api calls → FastAPI backend
    location /api/ {
        # A literal proxy_pass URI auto-strips the /api/ prefix; once a
        # variable is involved (needed for the resolver above), nginx stops
        # rewriting and forwards the path unchanged — confirmed this broke
        # health checks with a 404 (backend has no /api/ prefix on its own
        # routes). Explicit rewrite restores the strip.
        #
        # `set` MUST come before `rewrite ... break` — break halts the whole
        # rewrite-module phase at that point, which set is also part of, so a
        # set placed after break silently never executes. Confirmed: this
        # exact ordering produced "using uninitialized backend_api variable"
        # and "invalid URL prefix" on every proxied request.
        set $backend_api "http://trading-api:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy WebSocket /ws → FastAPI backend. No prefix strip needed here (the
    # backend's own /ws routes match the incoming path exactly), so the
    # variable holds only scheme+host+port and the original URI passes
    # through unchanged — avoids the double-path risk of embedding /ws twice.
    location /ws {
        set $backend_ws "http://trading-api:8000";
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Serve React app — SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
